<!DOCTYPE html>
<html>
<head>
  <title>StudyNet - Login</title>
</head>
<body style="margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh;">
  <h1>Login to StudyNet</h1>
  <br>
  <form id="loginform" onsubmit="event.preventDefault();">
    <label for="email">Email: </label><input type="email" id="email" name="email" placeholder="Email" required>
  
    <br><label for="password">Password (8 characters minimum): </label><input type="password" id="password" name="password" minlength="8" placeholder="Password" required> <!-- Although there is a input field check, there is also a JS clientside and a serverside check, just in case. -->
    <br>
    <br><label for="cachelogin">Cache my login info: </label><input type="checkbox" id="cachelogin">
    <br><label for="longlogin">Keep me logged in for longer: </label><input type="checkbox" id="longlogin">
    <br>
    <br><button type="submit" id="loginbtn" onclick="sendlogin()">Login</button>
    <br><button type="button" id="registerbtn" onclick="register()">Register</button>
    <br>
  </form>
  <br>
  <br>
  <button onclick="guestlogin()">Continue as Guest</button>
</body>
<script>
  const FRM_loginform = document.getElementById("loginform");
  const CHK_cachelogin = document.getElementById("cachelogin");
  const CHK_longlogin = document.getElementById("longlogin");

  // REMOVED: function verifypassword() { // Removal Reason: To allow the user to type any character, including unicode, as their password - ensuring safety
    //const InvalidPassword = /[^a-zA-Z0-9~`!@#$%^&*()_+\-=\[\]{};:\\|,.<>\/?]/.test(document.getElementById("password").value); // Checks if input contains characters which are NOT in the regex, and verifies it. Characters " and ' banned, just in case.
    //if (InvalidPassword) {
    //  return false;
    //} else {
    //  return true;
    //}
  //}
  function sendlogin() { // TODO: Add so that on 3+ failed logins, force a HCaptcha.
    if (!FRM_loginform.checkValidity()) { // Checks if it meets the HTML regex, and informs the user of the check status if it fails.
      FRM_loginform.reportValidity(); 
      return;
    }
    /* Disabled
    if (verifypassword() == false) {
      alert("Invalid password!\n\nPlease note that quotation marks, such as \" and \', are not allowed.")
      return;
    }
    */

    if (CHK_cachelogin.checked) {
      localStorage.setItem("Email", String(document.getElementById("email").value));
      localStorage.setItem("SessionKey", "*AWAITING");
      localStorage.setItem("UserID", "*AWAITING");
      localStorage.setItem("LoginConfirmed", "*AWAITING");
      console.log("Login data cached, awaiting server verification...") 
    } else {
      sessionStorage.setItem("Email", String(document.getElementById("email").value));
      sessionStorage.setItem("SessionKey", "*AWAITING");
      sessionStorage.setItem("UserID", "*AWAITING");
      sessionStorage.setItem("LoginConfirmed", "*AWAITING");
      console.log("Login data cached for this session, awaiting server verification...") 
    }

    // TODO: send to server
  }
  function guestlogin() {
    localStorage.setItem("Email", "*GUEST");
    localStorage.setItem("SecureSessionKey", "*GUEST");
    localStorage.setItem("UserID", "*GUEST");
    localStorage.setItem("LoginConfirmed", "*GUEST");
    console.log("Logged in as a guest.")
  }
  function register() {
    window.location.href = "register.html";
  }
</script>
</html>
